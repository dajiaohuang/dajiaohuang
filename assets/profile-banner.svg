  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3f7"/>
      <stop offset="1" stop-color="#dce6ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#9db0bf" stroke-opacity=".27"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#9db0bf"/>

  <g fill="none" stroke="#849baa" stroke-width="1.5" stroke-dasharray="7 7">
    <path d="M904 160C850 114 809 90 754 65"/>
